═══ المرحلة 1: الجرد ═══
عدّ كل رولو قماش في الصورة من اليسار لليمين ومن الأعلى للأسفل.
• الرولوات مغلفة بنايلون شفاف — انظر للقماش الداخلي فقط، تجاهل النايلون
• عدّ كل رولو منفصلاً حتى المتجاورة بنفس اللون
• لا تخمّن أو تزيد — عدّ ما تراه فعلاً

═══ المرحلة 2: استخراج الألوان ═══
لكل لون مميز، استخرج hex code حقيقي من الصورة مباشرة.

قواعد HEX الصارمة — هذا الأهم:
✗ محظور تماماً استخدام ألوان CSS القياسية:
  #000080 ← استبدله بمثل #1A2B6D أو #243B8A أو #0F1F5C
  #008000 ← استبدله بمثل #2D7A3A أو #3D8B5E أو #1A6B45
  #FFFFFF ← استبدله بمثل #F8F4EE أو #FDF6E3 أو #F5F0E8
  #000000 ← استبدله بمثل #0D0D0D أو #1A1A1A أو #111111
  #FF0000, #0000FF, #FFFF00 ← كلها محظورة كقيم افتراضية
✓ المطلوب: hex يعكس التدرج الحقيقي للقماش في الصورة
